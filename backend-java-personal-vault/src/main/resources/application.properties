spring.config.import=optional:file:.env[.properties]

spring.application.name=personal-vault

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/personal_vault}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Cookies — keep Secure=true in every real deployment (HTTPS only). Only flip
# COOKIE_SECURE=false for local HTTP dev, where the browser would otherwise
# silently drop the refresh cookie.
app.cookie.secure=${COOKIE_SECURE:true}

# File storage
app.storage.path=${STORAGE_PATH:./storage/documents}
app.storage.max-file-size-mb=10
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
